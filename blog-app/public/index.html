<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0c12">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>DevBlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c12;
      --bg-2: #0f1220;
      --surface: rgba(255, 255, 255, 0.045);
      --surface-strong: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #eef0f7;
      --text-muted: #9aa3b8;
      --text-faint: #6b7285;
      --accent-1: #8b5cf6;
      --accent-2: #6366f1;
      --accent-3: #22d3ee;
      --grad: linear-gradient(135deg, #8b5cf6 0%, #6366f1 55%, #22d3ee 120%);
      --success: #34d399;
      --danger: #fb7185;
      --danger-grad: linear-gradient(135deg, #f43f5e, #fb7185);
      --radius: 18px;
      --shadow-glow: 0 8px 40px -12px rgba(99, 102, 241, 0.45);
      --shadow-card: 0 18px 50px -24px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      background-image:
        radial-gradient(900px 600px at 85% -10%, rgba(99, 102, 241, 0.16), transparent 60%),
        radial-gradient(800px 500px at -10% 20%, rgba(139, 92, 246, 0.14), transparent 60%),
        radial-gradient(700px 500px at 50% 110%, rgba(34, 211, 238, 0.08), transparent 60%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* ---------- Header ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.5rem;
      background: rgba(10, 12, 18, 0.72);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--text);
    }

    .brand-logo-img {
      height: 42px;
      width: auto;
      display: block;
      border-radius: 10px;
      filter: drop-shadow(0 6px 18px -6px rgba(99, 102, 241, 0.55));
      transition: transform 0.25s, filter 0.25s;
    }
    .brand:hover .brand-logo-img { transform: translateY(-1px); filter: drop-shadow(0 8px 22px -6px rgba(99, 102, 241, 0.8)); }

    /* ---------- Auth toggle (switch) ---------- */
    .auth-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      padding: 0.45rem 0.7rem 0.45rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      transition: border-color 0.25s, background 0.25s, color 0.25s;
      white-space: nowrap;
    }
    .auth-toggle:hover { border-color: var(--border-strong); }
    .auth-toggle input { position: absolute; opacity: 0; pointer-events: none; }

    .auth-icon { display: grid; place-items: center; color: var(--text-muted); transition: color 0.25s; }

    .switch {
      position: relative;
      width: 34px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .auth-toggle input:checked + .switch { background: var(--grad); box-shadow: 0 0 14px rgba(99, 102, 241, 0.6); }
    .auth-toggle input:checked + .switch::after { transform: translateX(14px); }
    .auth-toggle input:checked ~ .auth-state::after { content: 'Admin Mode'; color: #c7d2fe; }
    .auth-toggle .auth-state::after { content: 'Guest Mode'; }
    .auth-toggle:has(input:checked) { border-color: rgba(139, 92, 246, 0.45); background: rgba(139, 92, 246, 0.08); }

    /* ---------- Container & views ---------- */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 2.4rem 1.25rem 5rem;
    }

    .view { animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden { display: none !important; }

    /* ---------- Home heading ---------- */
    .home-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
    }

    .kicker {
      font-family: 'Sora', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-3);
      margin-bottom: 0.35rem;
    }

    h1, h2, h3 { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; line-height: 1.25; }

    .home-head h2 { font-size: 1.9rem; font-weight: 700; }

    .home-sub {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.3rem;
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.55rem 1.05rem;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.18s, box-shadow 0.25s, filter 0.25s, background 0.25s, border-color 0.25s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--grad);
      color: #fff;
      box-shadow: 0 8px 24px -10px rgba(99, 102, 241, 0.7);
    }
    .btn-primary:hover { box-shadow: 0 10px 30px -8px rgba(99, 102, 241, 0.9); filter: brightness(1.08); transform: translateY(-1px); }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border-strong);
    }
    .btn-secondary:hover { background: var(--surface-strong); transform: translateY(-1px); }

    .btn-danger {
      background: var(--danger-grad);
      color: #fff;
      box-shadow: 0 8px 22px -10px rgba(244, 63, 94, 0.7);
    }
    .btn-danger:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 10px 28px -8px rgba(244, 63, 94, 0.85); }

    .btn-new {
      font-size: 0.9rem;
      padding: 0.65rem 1.25rem;
      border-radius: 14px;
    }

    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.78rem; border-radius: 10px; }

    /* ---------- Cards ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.1rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-card);
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(600px 200px at 0% 0%, rgba(139, 92, 246, 0.08), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .post-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-card), 0 0 0 1px rgba(139, 92, 246, 0.15), 0 24px 60px -20px rgba(0, 0, 0, 0.8);
    }
    .post-card:hover::before { opacity: 1; }

    .post-card { position: relative; z-index: 1; }

    .post-top {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 0.9rem;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.5);
    }

    .post-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      color: var(--text);
      transition: color 0.2s;
    }
    .post-card:hover .post-title { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

    .post-meta {
      color: var(--text-muted);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .post-meta .dot { color: var(--text-faint); }

    .reading-time {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent-3);
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.25);
      padding: 0.05rem 0.5rem;
      border-radius: 999px;
      margin-left: 0.25rem;
    }

    .post-excerpt {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 1.1rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    /* ---------- Empty state ---------- */
    .empty-state {
      text-align: center;
      padding: 3.5rem 1.5rem;
    }
    .empty-art {
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem;
      border-radius: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 40px rgba(139, 92, 246, 0.08);
    }
    .empty-state h3 { font-size: 1.3rem; margin-bottom: 0.4rem; }
    .empty-state p { color: var(--text-muted); font-size: 0.92rem; max-width: 340px; margin: 0 auto 1.4rem; }

    /* ---------- Detail view ---------- */
    .article {
      padding: 2.4rem 2.2rem;
    }
    .article-kicker {
      font-family: 'Sora', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .article-kicker::before {
      content: '';
      width: 26px;
      height: 2px;
      background: var(--grad);
      border-radius: 2px;
    }
    .article h2 { font-size: 2rem; font-weight: 700; margin-bottom: 0.7rem; }
    .article-meta { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.4rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .article-divider { border: none; height: 1px; background: linear-gradient(90deg, transparent, var(--border-strong), transparent); margin: 1.2rem 0 1.5rem; }
    .article-body {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.08rem;
      line-height: 1.85;
      color: #d9ddeb;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* ---------- Form view ---------- */
    .form-card { padding: 2.2rem; }
    .form-card h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.35rem; }
    .form-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.6rem; }

    form { display: flex; flex-direction: column; gap: 1.2rem; }

    .field label {
      display: block;
      font-family: 'Sora', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    input[type="text"], textarea {
      width: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      outline: none;
      resize: vertical;
    }
    input[type="text"]::placeholder, textarea::placeholder { color: var(--text-faint); }
    input[type="text"]:focus, textarea:focus {
      border-color: rgba(139, 92, 246, 0.65);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.16), 0 0 24px -6px rgba(99, 102, 241, 0.35);
      background: rgba(0, 0, 0, 0.35);
    }

    .form-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    /* ---------- Background orbs ---------- */
    .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      animation: orbFloat 20s ease-in-out infinite alternate;
    }
    .orb-1 { width: 400px; height: 400px; top: -120px; right: -100px; background: radial-gradient(circle, rgba(139, 92, 246, 0.5), transparent 70%); }
    .orb-2 { width: 340px; height: 340px; bottom: -140px; left: -80px; background: radial-gradient(circle, rgba(34, 211, 238, 0.38), transparent 70%); animation-delay: -6s; }
    .orb-3 { width: 280px; height: 280px; top: 42%; left: 62%; background: radial-gradient(circle, rgba(99, 102, 241, 0.42), transparent 70%); animation-delay: -11s; }
    .orb-4 { width: 210px; height: 210px; top: 10%; left: 6%; background: radial-gradient(circle, rgba(244, 63, 94, 0.24), transparent 70%); animation-delay: -16s; }
    @keyframes orbFloat {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(-34px, 44px) scale(1.14); }
    }

    /* ---------- Kicker icon ---------- */
    .kicker { display: flex; align-items: center; gap: 0.55rem; }
    .kicker-ico {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.32);
      color: var(--accent-3);
      flex-shrink: 0;
    }

    /* ---------- Input icons ---------- */
    .input-wrap { position: relative; }
    .input-wrap .input-ico {
      position: absolute;
      left: 0.95rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
      transition: color 0.25s;
      z-index: 1;
    }
    .input-wrap .input-ico.ico-top { top: 1.05rem; transform: none; }
    .input-wrap:focus-within .input-ico { color: var(--accent-2); }
    .input-wrap input[type="text"] { padding-left: 2.7rem; }
    .input-wrap textarea { padding-left: 2.7rem; }

    /* ---------- Footer ---------- */
    .footer {
      border-top: 1px solid var(--border);
      margin-top: 1rem;
      padding: 2.4rem 1.25rem 2.6rem;
      text-align: center;
      background: rgba(10, 12, 18, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .footer-inner { max-width: 860px; margin: 0 auto; }
    .footer-logo {
      height: 34px;
      width: auto;
      margin: 0 auto 0.8rem;
      display: block;
      opacity: 0.92;
      filter: drop-shadow(0 4px 14px -4px rgba(99, 102, 241, 0.5));
    }
    .footer-tag { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.1rem; }
    .footer-icons { display: flex; justify-content: center; gap: 0.6rem; margin-bottom: 1.2rem; }
    .f-ico {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .f-ico:hover {
      transform: translateY(-3px);
      color: #fff;
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 8px 20px -8px rgba(99, 102, 241, 0.6);
      background: rgba(139, 92, 246, 0.15);
    }
    .footer-copy { color: var(--text-faint); font-size: 0.8rem; }
    .footer-copy .heart { color: var(--danger); }

    /* ---------- Scrollbar ---------- */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #2a2f45; border-radius: 6px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: #3a4060; }

    ::selection { background: rgba(139, 92, 246, 0.35); color: #fff; }

    /* ---------- Responsive ---------- */
    @media (max-width: 600px) {
      .container { padding: 1.6rem 1rem 4rem; }
      .home-head h2 { font-size: 1.5rem; }
      .home-head { align-items: flex-start; flex-direction: column; }
      .btn-new { width: 100%; }
      .article { padding: 1.6rem 1.3rem; }
      .article h2 { font-size: 1.45rem; }
      .form-card { padding: 1.5rem; }
      .article-body { font-size: 1rem; }
      header { padding: 0.75rem 1rem; }
      .brand-logo-img { height: 34px; }
      .auth-state { display: none; }
    }
  </style>
</head>
<body>

  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
  </div>

  <header>
    <a class="brand" href="#" onclick="showHomeView(); return false;">
      <img class="brand-logo-img" src="logo.png" alt="DevBlog">
    </a>
    <label class="auth-toggle" for="authCheck">
      <input type="checkbox" id="authCheck" onchange="toggleAuth()">
      <span class="switch"></span>
      <span class="auth-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </span>
      <span class="auth-state"></span>
    </label>
  </header>

  <div class="container">

    <!-- Home view -->
    <div id="homeSection" class="view">
      <div class="home-head">
        <div>
          <p class="kicker"><span class="kicker-ico"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></svg></span> The Community Feed</p>
          <h2>Recent Posts</h2>
          <p class="home-sub">Fresh ideas, tutorials &amp; stories from our writers.</p>
        </div>
        <button id="createBtn" class="btn btn-primary btn-new hidden" onclick="showFormView()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New Post
        </button>
      </div>
      <div id="postsList"></div>
    </div>

    <!-- Create/Edit Form View -->
    <div id="formSection" class="view hidden">
      <div class="card form-card">
        <h2 id="formTitle">Create New Post</h2>
        <p class="form-sub">Share your knowledge with the community.</p>
        <form id="postForm" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="postId">
          <div class="field">
            <label for="postTitle">Title</label>
            <div class="input-wrap">
              <svg class="input-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
              <input type="text" id="postTitle" placeholder="An inspiring post title..." required>
            </div>
          </div>
          <div class="field">
            <label for="postAuthor">Author</label>
            <div class="input-wrap">
              <svg class="input-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="postAuthor" placeholder="Your name" required>
            </div>
          </div>
          <div class="field">
            <label for="postContent">Content</label>
            <div class="input-wrap">
              <svg class="input-ico ico-top" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
              <textarea id="postContent" rows="7" placeholder="Write your story here..." required></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
              Save Post
            </button>
            <button type="button" class="btn btn-secondary" onclick="showHomeView()">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Single Post Detail View -->
    <div id="detailSection" class="view hidden">
      <div class="card article">
        <p class="article-kicker"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> DevBlog Article</p>
        <h2 id="detailTitle"></h2>
        <p class="article-meta" id="detailMeta"></p>
        <hr class="article-divider">
        <div class="article-body" id="detailContent"></div>
        <div class="actions">
          <button class="btn btn-secondary" onclick="showHomeView()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Posts
          </button>
        </div>
      </div>
    </div>

  </div>

  <footer class="footer">
    <div class="footer-inner">
      <img class="footer-logo" src="logo.png" alt="DevBlog">
      <p class="footer-tag">DevBlog — ideas worth reading.</p>

  <script>
    let isAuthorized = false;
    const API_URL = '/api/posts';

    function toggleAuth() {
      isAuthorized = document.getElementById('authCheck').checked;
      renderApp();
    }

    function getAuthHeaders() {
      return isAuthorized ? { 'Authorization': 'Bearer secret-admin-token', 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
    }

    const AVATAR_GRADS = [
      'linear-gradient(135deg,#8b5cf6,#6366f1)',
      'linear-gradient(135deg,#f43f5e,#fb7185)',
      'linear-gradient(135deg,#10b981,#34d399)',
      'linear-gradient(135deg,#f59e0b,#fbbf24)',
      'linear-gradient(135deg,#06b6d4,#22d3ee)',
      'linear-gradient(135deg,#ec4899,#f472b6)'
    ];

    function initialsOf(name) {
      return name.trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
    }

    function readingTime(content) {
      return Math.max(1, Math.ceil((content.trim().split(/\s+/).length || 0) / 200));
    }

    async function fetchPosts() {
      const res = await fetch(API_URL);
      const posts = await res.json();
      const list = document.getElementById('postsList');

      if (posts.length === 0) {
        list.innerHTML = `
          <div class="card empty-state">
            <div class="empty-art">
              <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
                <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
                <path d="M9 12h6M9 16h6"/>
              </svg>
            </div>
            <h3>No posts yet</h3>
            <p>Be the first to share something brilliant with the community.</p>
            <button class="btn btn-primary ${isAuthorized ? '' : 'hidden'}" onclick="showFormView()">+ Write your first post</button>
          </div>`;
        return;
      }

      list.innerHTML = posts.map((post, i) => {
        const initials = initialsOf(post.author);
        const grad = AVATAR_GRADS[i % AVATAR_GRADS.length];
        const mins = readingTime(post.content);
        return `
        <div class="card post-card">
          <div class="post-top">
            <span class="avatar" style="background:${grad}">${initials}</span>
            <div>
              <p class="post-title">${escapeHtml(post.title)}</p>
              <p class="post-meta">
                By ${escapeHtml(post.author)}
                <span class="dot">•</span>
                ${new Date(post.createdAt).toLocaleDateString()}
                <span class="reading-time">${mins} min read</span>
              </p>
            </div>
          </div>
          <p class="post-excerpt">${escapeHtml(post.content.substring(0, 150))}...</p>
          <div class="actions">
            <button class="btn btn-secondary btn-sm" onclick="viewPost(${post.id})">Read More <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
            ${isAuthorized ? `
              <button class="btn btn-primary btn-sm" onclick="editPost(${post.id})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deletePost(${post.id})">Delete</button>
            ` : ''}
          </div>
        </div>
      `}).join('');
    }

    async function viewPost(id) {
      const res = await fetch(`${API_URL}/${id}`);
      const post = await res.json();

      document.getElementById('detailTitle').innerText = post.title;
      document.getElementById('detailMeta').innerText = `By ${post.author} on ${new Date(post.createdAt).toLocaleString()}`;
      document.getElementById('detailContent').innerText = post.content;

      document.getElementById('homeSection').classList.add('hidden');
      document.getElementById('formSection').classList.add('hidden');
      document.getElementById('detailSection').classList.remove('hidden');
    }

    function showFormView(post = null) {
      document.getElementById('homeSection').classList.add('hidden');
      document.getElementById('detailSection').classList.add('hidden');
      document.getElementById('formSection').classList.remove('hidden');

      if (post) {
        document.getElementById('formTitle').innerText = 'Edit Post';
        document.getElementById('postId').value = post.id;
        document.getElementById('postTitle').value = post.title;
        document.getElementById('postAuthor').value = post.author;
        document.getElementById('postContent').value = post.content;
      } else {
        document.getElementById('formTitle').innerText = 'Create New Post';
        document.getElementById('postForm').reset();
        document.getElementById('postId').value = '';
      }
    }

    function showHomeView() {
      document.getElementById('homeSection').classList.remove('hidden');
      document.getElementById('formSection').classList.add('hidden');
      document.getElementById('detailSection').classList.add('hidden');
      fetchPosts();
    }

    async function editPost(id) {
      const res = await fetch(`${API_URL}/${id}`);
      const post = await res.json();
      showFormView(post);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('postId').value;
      const title = document.getElementById('postTitle').value;
      const author = document.getElementById('postAuthor').value;
      const content = document.getElementById('postContent').value;

      const method = id ? 'PUT' : 'POST';
      const url = id ? `${API_URL}/${id}` : API_URL;

      const res = await fetch(url, {
        method,
        headers: getAuthHeaders(),
        body: JSON.stringify({ title, author, content })
      });

      if (res.ok) {
        showHomeView();
      } else {
        const data = await res.json();
        alert(data.error || 'Operation failed');
      }
    }

    async function deletePost(id) {
      if (!confirm('Are you sure you want to delete this post?')) return;

      const res = await fetch(`${API_URL}/${id}`, {
        method: 'DELETE',
        headers: getAuthHeaders()
      });

      if (res.ok) {
        fetchPosts();
      } else {
        const data = await res.json();
        alert(data.error || 'Delete failed');
      }
    }

    function renderApp() {
      document.getElementById('createBtn').classList.toggle('hidden', !isAuthorized);
      fetchPosts();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g,
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    renderApp();
  </script>
</body>
